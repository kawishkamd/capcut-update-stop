name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Correctness lives in the OS-agnostic library, so the real test suite runs on
  # Linux - fast, and where `cargo test` exercises the engine against MockSystem.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native-tls deps (OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  # Type-check the Windows-only code without a Windows runner (no linker needed),
  # so a broken FFI change fails fast on every PR.
  check-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target x86_64-pc-windows-gnu

  # Build the real, shippable .exe (MSVC toolchain, embedded UAC manifest).
  build-windows:
    runs-on: windows-latest
    # Needed for the tagged-release step to create a GitHub Release (the Python
    # CI lacked this, which is why release-on-tag silently failed there).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item target/release/capcut-blocker.exe
          Write-Host ("capcut-blocker.exe: {0:N2} MB" -f ($f.Length / 1MB))
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: capcut-blocker-windows
          path: target/release/capcut-blocker.exe
          retention-days: 90
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/capcut-blocker.exe
